packages:
  - 'apps/*'
  - '!apps/cli'
  - '!apps/web-verifier'
  - 'packages/*'
  - 'services/*'
  - 'modules/*'

overrides:
  qs: '>=6.15.2'
  # api-server runtime: Nest pins older copies of these
  fastify: '^5.12.7'
  find-my-way: '^9.10.0'
  multer: '^2.5.0'
  fast-uri@3: '^3.1.9'
  # web runtime / build
  dompurify: '^3.4.17'
  postcss: '^8.5.31'
  postcss-selector-parser@6: '^6.1.5'
  postcss-selector-parser@7: '^7.1.7'
  browserslist: '^4.29.4'
  baseline-browser-mapping: '^2.11.32'
  js-yaml@5: '^5.5.0'
  '@babel/core': '^7.29.1'
  brace-expansion@1: '^1.1.21'
  brace-expansion@2: '^2.1.7'
  brace-expansion@5: '^5.0.12'

minimumReleaseAge: 0

allowBuilds:
  esbuild: true
  sharp: true
  '@nestjs/core': true
  unrs-resolver: true
  '@scarf/scarf': false
  core-js: false
