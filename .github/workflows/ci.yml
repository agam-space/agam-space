name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api-server/**'
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'eslint.config.js'
      - 'commitlint.config.mjs'
      - 'jest.preset.js'
  push:
    branches: [main]
    paths:
      - 'apps/api-server/**'
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'eslint.config.js'
      - 'commitlint.config.mjs'
      - 'jest.preset.js'

env:
  NODE_VERSION: '22'

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-format]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (required before testing dependents)
        run: pnpm build:packages

      - name: Run tests with coverage (all packages & apps)
        run: pnpm test:cov

      - name: Upload coverage – core
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: packages/core/coverage/
          if-no-files-found: ignore

      - name: Upload coverage – client
        uses: actions/upload-artifact@v4
        with:
          name: coverage-client
          path: packages/client/coverage/
          if-no-files-found: ignore

      - name: Upload coverage – shared-types
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shared-types
          path: packages/shared-types/coverage/
          if-no-files-found: ignore

      - name: Upload coverage – api-server
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api-server
          path: apps/api-server/coverage/
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: >-
            packages/core/coverage/lcov.info,
            packages/client/coverage/lcov.info,
            apps/api-server/coverage/lcov.info
          flags: core,client,api-server
          fail_ci_if_error: false

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-format]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: pnpm --filter api-server test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-format]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Build apps
        run: pnpm build:apps

  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, integration-test, build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hardened Images
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Test Docker build (don't push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api-server/Dockerfile
          target: runner
          push: false
          tags: agam-space:test
          build-args: |
            APP_VERSION=test
            BUILD_COMMIT=${{ github.sha }}
            BUILD_ID=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Hardened Docker build (don't push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api-server/Dockerfile
          target: runner-hardened
          push: false
          tags: agam-space:test-hardened
          platforms: linux/amd64
          build-args: |
            APP_VERSION=test
            BUILD_COMMIT=${{ github.sha }}
            BUILD_ID=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
