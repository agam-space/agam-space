services:
  postgres:
    image: postgres:15-alpine
    container_name: agam-space-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agam_space
      POSTGRES_USER: agam_space
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8'
    ports:
      - '5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agam_space -d agam_space']
      interval: 10s
      timeout: 5s
      retries: 5

  proxy:
    image: nginx:alpine
    container_name: agam-proxy
    ports:
      - '3333:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  minio:
    image: minio/minio:latest
    container_name: agam-space-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agam_space
      MINIO_ROOT_PASSWORD: dev_password_123
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web console
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: agam-space-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 agam_space dev_password_123 &&
      mc mb --ignore-existing local/agam-space
      "
