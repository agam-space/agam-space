services:
  postgres:
    image: postgres:15-alpine
    container_name: agam-space-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agam_space
      POSTGRES_USER: agam_space
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8'
    ports:
      - '5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agam_space -d agam_space']
      interval: 10s
      timeout: 5s
      retries: 5

  proxy:
    image: nginx:alpine
    container_name: agam-proxy
    ports:
      - '3333:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: agam-space-garage
    restart: unless-stopped
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: agam_space
      GARAGE_DEFAULT_SECRET_KEY: dev_password_123_dev_password_123
      GARAGE_DEFAULT_BUCKET: agam-space
    ports:
      - '3900:3900' # S3 API
      - '3903:3903' # Admin API
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - ./data/garage/meta:/var/lib/garage/meta
      - ./data/garage/data:/var/lib/garage/data
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 5s
      timeout: 5s
      retries: 5
